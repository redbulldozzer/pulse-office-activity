events { worker_connections 1024; }
http {
  server_tokens off;
  gzip on;
  gzip_types application/javascript text/css application/json;
  gzip_min_length 1024;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $uri $asset_cache { default 'no-cache'; ~^/assets/ 'public, max-age=31536000, immutable'; }
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  access_log off;
  limit_req_zone $binary_remote_addr zone=ingest:10m rate=20r/s;
  resolver 192.0.2.1 valid=10s ipv6=off;
  upstream api { zone api 64k; server api:8000 resolve; keepalive 16; }
  server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/office-activity/tls/server.crt;
    ssl_certificate_key /etc/office-activity/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { proxy_pass http://api; }
    location = /api/v1/events {
      limit_req zone=ingest burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      proxy_connect_timeout 5s;
      proxy_read_timeout 25s;
    }
    add_header Cache-Control $asset_cache;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://api;
      proxy_read_timeout 25s;
    }
    location /api/ {
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://api;
      proxy_read_timeout 25s;
    }
    location /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
